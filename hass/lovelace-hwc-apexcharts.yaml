type: custom:apexcharts-card
header:
  show: true
  title: Hot water plan
  show_states: false
  colorize_states: true
graph_span: 36h
span:
  start: minute
  offset: "-12h"
now:
  show: true
  label: ""
  color: "#90a4ae"
yaxis:
  - id: temp
    decimals: 0
    apex_config:
      title:
        text: °C
      tickAmount: 5
  - id: price
    opposite: true
    decimals: 2
    apex_config:
      show: false
  - id: ambient
    opposite: true
    decimals: 0
    apex_config:
      show: false
  - id: power
    opposite: true
    decimals: 0
    apex_config:
      show: false
  - id: soc
    opposite: true
    min: 0
    max: 1
    decimals: 2
    apex_config:
      show: false
series:
  - entity: sensor.aquatech_current_temperature_local
    name: Tank temp (measured)
    extend_to: now
    type: line
    curve: smooth
    stroke_width: 2
    color: "#1e88e5"
    yaxis_id: temp
    group_by:
      duration: 15min
      func: avg
      fill: last
  - entity: sensor.hwc_predicted_temp
    name: Tank temp (executor)
    extend_to: false
    type: line
    curve: smooth
    stroke_width: 2
    color: "#1e88e5"
    yaxis_id: temp
    data_generator: |
      return (entity.attributes.predicted_temperatures || []).map(p => {
        return [new Date(p.date).getTime(), parseFloat(p.hwc_predicted_temp)];
      });
  - entity: sensor.hwc_wet_bulb_forecast
    name: Wet bulb (measured)
    extend_to: now
    type: line
    curve: smooth
    stroke_width: 1
    opacity: 0.45
    color: "#0097a7"
    yaxis_id: ambient
  - entity: sensor.hwc_wet_bulb_forecast
    name: Wet bulb (forecast)
    extend_to: false
    type: line
    curve: smooth
    stroke_width: 1
    opacity: 0.45
    color: "#0097a7"
    yaxis_id: ambient
    data_generator: |
      return (entity.attributes.wet_bulb_forecasts || []).map(p => {
        return [new Date(p.date).getTime(), parseFloat(p.hwc_wet_bulb_forecast)];
      });
  - entity: sensor.amber_5min_current_general_price
    name: Import price (actual)
    extend_to: now
    type: line
    curve: stepline
    stroke_width: 1
    opacity: 0.25
    color: "#fb8c00"
    yaxis_id: price
    group_by:
      duration: 5min
      func: last
      fill: last
  - entity: sensor.hwc_unit_load_cost
    name: Import price (forecast)
    extend_to: false
    type: line
    curve: stepline
    stroke_width: 1
    opacity: 0.35
    color: "#fb8c00"
    yaxis_id: price
    data_generator: |
      return (entity.attributes.unit_load_cost_forecasts || []).map(p => {
        return [new Date(p.date).getTime(), parseFloat(p.hwc_unit_load_cost)];
      });
  - entity: sensor.athom_energy_monitor_02a3c8_athom_energy_monitor_02a3c8_power_2
    name: Heat pump (measured)
    extend_to: now
    type: area
    curve: stepline
    stroke_width: 1
    opacity: 0.22
    color: "#43a047"
    yaxis_id: power
  - entity: sensor.hwc_power_plan
    name: Planned heat pump
    extend_to: false
    type: area
    curve: stepline
    stroke_width: 1
    opacity: 0.16
    color: "#43a047"
    yaxis_id: power
    data_generator: |
      return (entity.attributes.deferrables_schedule || []).map(p => {
        return [new Date(p.date).getTime(), parseFloat(p.hwc_power_plan)];
      });
  # Two-state model diagnostics (sensor.hwc_soc_state, present only when
  # hwc.dp_planner.soc_model is enabled). T_hot = hot-zone temp; probe (model) =
  # the model's g(V_hot, T_hot) — compare against the measured/executor tank temp.
  # V_hot = planned hot-zone fraction on its own 0–1 axis.
  - entity: sensor.hwc_soc_state
    name: T_hot (model)
    extend_to: false
    type: line
    curve: smooth
    stroke_width: 1
    opacity: 0.6
    color: "#8e24aa"
    yaxis_id: temp
    data_generator: |
      return (entity.attributes.soc_forecast || []).map(p => {
        return [new Date(p.date).getTime(), parseFloat(p.t_hot)];
      });
  - entity: sensor.hwc_soc_state
    name: Probe (model)
    extend_to: false
    type: line
    curve: smooth
    stroke_width: 1
    opacity: 0.6
    color: "#d81b60"
    yaxis_id: temp
    data_generator: |
      return (entity.attributes.soc_forecast || []).map(p => {
        return [new Date(p.date).getTime(), parseFloat(p.probe)];
      });
  - entity: sensor.hwc_soc_state
    name: V_hot (hot fraction)
    extend_to: false
    type: area
    curve: smooth
    stroke_width: 1
    opacity: 0.12
    color: "#6d4c41"
    yaxis_id: soc
    data_generator: |
      return (entity.attributes.soc_forecast || []).map(p => {
        return [new Date(p.date).getTime(), parseFloat(p.v_hot)];
      });
apex_config:
  chart:
    height: 320
