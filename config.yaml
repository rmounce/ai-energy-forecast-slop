hwc:
  tank_temp_entity: sensor.aquatech_current_temperature_local
  import_price_entity: sensor.ai_dh_import_price_forecast
  short_term_import_price_entity: sensor.ai_mpc_import_price_forecast
  emhass_mpc_unit_load_cost_entity: sensor.mpc_unit_load_cost
  emhass_dh_unit_load_cost_entity: sensor.dh_unit_load_cost
  predicted_temp_entity: sensor.predicted_temp
  power_plan_entity: sensor.power_plan
  publish_prefix: hwc_
  planner: dp
  horizon_steps: 576
  optimization_time_step: 5
  # AUD charged per compressor start; the DP's only short-cycle deterrent.
  transition_cost_aud: 0.05
  # Local clock time by which the daily 60 °C (legionella) obligation must be met.
  main_window_end: '18:00'
  weather:
    wet_bulb_smoothing_minutes: 180
  thermal:
    volume_l: 225
    density: 997
    heat_capacity: 4.184
    supply_temperature: 60
    carnot_efficiency: 0.38
    thermal_loss_kw: 0.12
    nominal_power_w: 780
    compressor_power_reference_w: 740
    compressor_power_reference_wet_bulb_c: 12.5
    compressor_power_wet_bulb_slope_w_per_c: 1.5
    compressor_power_reference_tank_c: 50.0
    compressor_power_tank_slope_w_per_c: 15.0
    compressor_power_min_w: 650
    compressor_power_max_w: 930
    min_temp: 45
    max_temp: 60
    desired_temp: 60
    penalty_factor: 15
    thermal_inertia_time_constant: 0.5
    standing_loss_ua_kw_per_c: 0.0025
    heat_rate_c_per_hour: 6.6
    # Heat rate eases continuously from the full-reheat rate to the near-target top-up rate across a
    # band centred on top_up_start_temp_c with this total width (50→56 °C). Continuous (no step), so
    # the DP can't arbitrage a discontinuity by stopping/restarting — replaces the old FULL/TOP-UP
    # regime latch that caused the 53 °C short cycle. width 0 = former hard step.
    top_up_start_temp_c: 53.0
    heat_rate_taper_width_c: 6.0
    top_up_heat_rate_c_per_hour: 5.5
    heat_rate_reference_wet_bulb_c: 12.5
    heat_rate_wet_bulb_slope_c_per_c: 0.08
    heat_rate_min_c_per_hour: 4.8
    heat_rate_max_c_per_hour: 7.6
    terminal_target: current
  dp_planner:
    # survivors_per_state: 2 keeps the max-temp ("run a bit longer") path as well as the
    # min-cost one. Enabled at owner's request; measured net-negative (~1c/plan) and NOT
    # objectively helpful (errs warmer/safer). See docs/hwc_dp_planner.md. Revert to 1 anytime.
    survivors_per_state: 2
    # min_temp floor penalty, AUD/°C charged EACH 5-min step under min_temp. Code default 5.0
    # makes the floor effectively hard (yields only above ~$47/kWh). 0.1 lets the tank ride
    # through high prices — yields above ~$0.94/kWh single-step — while the per-step
    # accumulation still caps how long/deep it sits under-floor. See docs/hwc_dp_planner.md.
    min_temp_penalty_aud_per_c: 0.1
    # Opt-in two-state (V_hot, T_hot) decision model — replaces the FULL/TOP-UP regime latch with
    # the continuous stratified-tank model (no 53 °C discontinuity). Render + executor/EMHASS
    # contract unchanged; the daemon tracks (V_hot, T_hot) in data/hwc_daemon_state.json and
    # publishes sensor.hwc_soc_state for the apexcharts card. See docs/hwc_2state_soc_model.md.
    # SHELVED 2026-06-27. The 2-state plan was less plausible than the legacy single-state DP: the
    # build phase grows V_hot at ~const T_hot, so the temperature-driven compressor-power model
    # flatlines during build instead of rising ~linearly with the run as observed in practice. That
    # power signature is evidence the single rising tank temperature (legacy) is the more faithful
    # model; splitting into (V_hot, T_hot) breaks the monotonic power<->temp relationship. The seed
    # divergence (Option 2) is real but orthogonal and would not fix the power shape. Code + xfail
    # regression tests kept for a possible future revisit. See docs/hwc_2state_soc_model.md.
    soc_model: false
    soc:
      t_mains_c: 18.0              # Adelaide winter mains/inlet (model parameter; tune seasonally)
      draw_prior_kwh_per_day: 1.2  # conservative draw prior (defaults to draw_off.total_kwh)
      cliff_probe_c: 39.0          # probe below this snaps V_hot→sensor_height (deep-draw watermark)
  actuation:
    # Re-enabled 2026-06-27 after the publish-only watch: the continuous-taper plan looked good on
    # the chart and the 53 °C short-cycle is structurally gone (rate is f(current temp), no carried
    # regime; only the intentional min-off/debounce hardware hysteresis remains). Executor drives
    # the heat pump again.
    enabled: true
    water_heater_entity: water_heater.aquatech
    compressor_entity: binary_sensor.aquatech_compressor
    operation_mode: heat_pump
    power_on_threshold_w: 100
    setpoint_min_c: 55
    setpoint_max_c: 60
  daemon:
    state_file: data/hwc_daemon_state.json
    debounce_seconds: 2
    heartbeat_seconds: 1800
    execution_interval_seconds: 60
    cycle_history_len: 20     # max rows kept/shown in sensor.hwc_cycles
  # Publish-only per-cycle reporting to sensor.hwc_cycles (table of recent heat-pump runs + a live
  # in-progress row). Firewalled from the planner/executor — a failure here never affects
  # actuation. See docs/hwc_cycle_reporting.md.
  reporting:
    enabled: true
    cycles_entity: sensor.hwc_cycles
    # Athom channel-2 cumulative kWh meter; differenced over each cycle for the elec figure.
    energy_counter_entity: sensor.athom_energy_monitor_02a3c8_athom_energy_monitor_02a3c8_energy_2
    poll_seconds: 60          # live-row refresh + compressor-edge poll
    backfill_seconds: 900     # how often to re-run the COP analyser over recent history
    lookback_hours: 240       # window the analyser reconstructs completed cycles from (must cover ~cycle_history_len runs to fill the table on a cold start)
    minimum_replan_interval_seconds: 60
    tank_temp_replan_delta_c: 0.3
    # Suppress an off issued right after a heat command until the Tuya compressor sensor
    # confirms running, bridging its ~60 s LocalTuya poll lag. 120 s = 2 poll cycles.
    heat_command_grace_seconds: 120
    # Symmetric hardware guard: minimum compressor rest after an off command before a restart is
    # allowed. Bounds the start rate against sensor jitter / model edge-cases regardless of the
    # planner. 180 s = 3 min, a typical heat-pump anti-short-cycle minimum.
    min_off_seconds: 180
    # For the planner's effective-running signal: a compressor off (while below target, with
    # heat still commanded) shorter than this is treated as a defrost pause, not a stop.
    compressor_off_debounce_seconds: 600
    fallback_enabled: true
    fallback_window_start: '10:00'
    fallback_window_end: '16:00'
    fallback_min_temp_c: 48
    fallback_setpoint_c: 60
  draw_off:
    total_kwh: 1.2
    window_start: 06:00
    window_end: 07:00
