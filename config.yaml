influxdb:
  host: localhost
  port: 8086
  username: user
  password: ''
  database: hass
home_assistant:
  url: http://localhost:8123
  token: ''
  weather_entity: weather.woodville_west_hourly
  amber_entity: sensor.amber_30min_forecasts_general_price
  amber_feed_in_entity: sensor.amber_30min_forecasts_feed_in_price
  amber_billing_entity: sensor.amber_billing_interval_forecasts_general_price
  solcast_entities:
  - sensor.solcast_pv_forecast_forecast_today
  - sensor.solcast_pv_forecast_forecast_tomorrow
  - sensor.solcast_pv_forecast_forecast_day_3
  - sensor.solcast_pv_forecast_forecast_day_4
  publish_entities:
    price: sensor.ai_price_forecast
    price_p30: sensor.ai_price_forecast_low
    price_p70: sensor.ai_price_forecast_high
    load: sensor.ai_load_forecast
    load_p65: sensor.ai_load_forecast_high
    load_p75: sensor.ai_load_forecast_p75
    pd_direct_price: sensor.ai_pd_direct_price_forecast
    pd_direct_price_q30: sensor.ai_pd_direct_price_forecast_low
    pd_direct_price_q70: sensor.ai_pd_direct_price_forecast_high
    aemo_price_forecast: sensor.ai_aemo_price_forecast
    tft_load: sensor.ai_tft_load_forecast
    tft_load_q10: sensor.ai_tft_load_forecast_low
    tft_load_q90: sensor.ai_tft_load_forecast_high
    p5min_price: sensor.ai_p5min_price_forecast
    p5min_price_q05: sensor.ai_p5min_price_forecast_low
    p5min_price_q95: sensor.ai_p5min_price_forecast_high
aemo_forecast:
  url: https://visualisations.aemo.com.au/aemo/apps/api/report/5MIN
  regions:
  - SA1
  - VIC1
  - NSW1
models:
  price:
    target_column: aemo_price_sa1
    primary_model_key: price
    quantile_models:
      price_p30:
        objective: quantile
        alpha: 0.3
        price_key: advanced_price_low
      price:
        objective: quantile
        alpha: 0.5
        price_key: advanced_price_predicted
      price_p70:
        objective: quantile
        alpha: 0.7
        price_key: advanced_price_high
    feature_cols:
    - power_pv
    - temperature_adelaide
    - humidity_adelaide
    - wind_speed_adelaide
    - total_demand_sa1
    - net_interchange_sa1
    - total_demand_vic1
    - net_interchange_vic1
    - total_demand_nsw1
    - net_interchange_nsw1
    - stpasa_uigf
    - stpasa_total_intermittent_generation
    - stpasa_ss_wind_uigf
    - stpasa_ss_solar_uigf
    - stpasa_ss_wind_capacity
    - stpasa_ss_solar_capacity
    - stpasa_wind_avail_frac
    - stpasa_solar_avail_frac
    - stpasa_net_load_proxy
    - stpasa_source_horizon_hours
    add_encoders:
      datetime_attribute:
        future:
        - hour
        - day_of_week
        - day_of_year
    target_lags:
    - -1
    - -2
    - -3
    - -4
    - -5
    - -6
    - -12
    - -24
    - -47
    - -48
    - -49
    - -95
    - -96
    - -97
    - -335
    - -336
    - -337
    future_covariate_lags:
    - -4
    - -3
    - -2
    - -1
    - 0
    - 1
    - 2
    - 3
    - 4
    lgbm_params:
      n_estimators: 250
      num_leaves: 31
      learning_rate: 0.03
      max_depth: 7
      reg_alpha: 0.1
      reg_lambda: 0.1
      random_state: 42
      n_jobs: -1
    forecast_horizon: 144
    training_history_days: 730
    recency_weighting:
      enabled: true
      half_life_days: 180
  load:
    target_column: power_load
    primary_model_key: load
    quantile_models:
      load:
        objective: quantile
        alpha: 0.5
      load_p65:
        objective: quantile
        alpha: 0.65
      load_p75:
        objective: quantile
        alpha: 0.75
    feature_cols:
    - power_pv
    - temperature_adelaide
    - humidity_adelaide
    - wind_speed_adelaide
    - is_daylight_saving_time
    - is_public_holiday
    add_encoders:
      datetime_attribute:
        future:
        - hour
        - day_of_week
        - day_of_year
    future_covariate_lags:
    - -4
    - -3
    - -2
    - -1
    - 0
    - 1
    - 2
    - 3
    - 4
    target_lags:
    - -1
    - -2
    - -3
    - -2
    - -4
    - -5
    - -6
    - -12
    - -47
    - -48
    - -49
    - -95
    - -96
    - -97
    - -335
    - -336
    - -337
    lgbm_params:
      n_estimators: 200
      num_leaves: 25
      learning_rate: 0.05
      max_depth: 6
      reg_alpha: 0.1
      reg_lambda: 0.1
      random_state: 42
      n_jobs: -1
    forecast_horizon: 144
    training_history_days: 730
    recency_weighting:
      enabled: true
      half_life_days: 90
  tft_price:
    target_column: aemo_price_sa1
    primary_model_key: tft_price
    forecast_horizon: 144
    quantile_models:
      tft_price_q30:
        objective: quantile
        alpha: 0.3
      tft_price:
        objective: quantile
        alpha: 0.5
      tft_price_q70:
        objective: quantile
        alpha: 0.7
  tft_load:
    forecast_horizon: 144
    primary_model_key: tft_load
    target_column: power_load
    quantile_models:
      tft_load:
        alpha: 0.5
        objective: quantile
      tft_load_q10:
        alpha: 0.1
        objective: quantile
      tft_load_q90:
        alpha: 0.9
        objective: quantile
  p5min_tactical:
    target_column: aemo_price_sa1
    primary_model_key: p5min_price
    forecast_horizon: 12
